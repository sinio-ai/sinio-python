[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sinio"
version = "0.1.0"
description = "Official Python SDK for the sinio.ai ingestion API (events, entities, locations, assignments)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["sinio", "events", "ingestion", "sdk"]
dependencies = []

[project.urls]
Homepage = "https://docs.sinio.ai/sdks"
Repository = "https://github.com/sinio-ai/sinio-python"
Issues = "https://github.com/sinio-ai/sinio-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/sinio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/sinio"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
